name: Isolated release rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-release-rehearsal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Production image, isolated migration, matching, reveal and notifications
        run: node scripts/release/local-rehearsal.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-release-${{ github.sha }}
          path: artifacts/release-output/
          retention-days: 7
          if-no-files-found: error
