name: Verify final fixed test-ci command
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0800fe1ae059b028ad02e8f7bf005993e3e95875
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Execute the exact final source entry point
        run: /usr/bin/time -p npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-command-0800fe1
          path: |
            artifacts/e2e-linux-results/
            artifacts/storybook-results.json
          retention-days: 7
          if-no-files-found: error
