name: Storybook Visual Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-visual-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storybook-visual-evidence:
    name: Storybook smoke tests and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000/v1"
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Storybook-relevant changes
        id: storybook_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- \
            apps/web \
            packages/shared \
            package.json \
            package-lock.json \
            .node-version \
            vitest.config.ts \
            scripts/capture-storybook-screenshots.mjs \
            .github/workflows/storybook-visual-evidence.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Storybook-relevant changes; expensive checks will be skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.storybook_changes.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.storybook_changes.outputs.run == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.storybook_changes.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build static Storybook
        if: steps.storybook_changes.outputs.run == 'true'
        run: npm run build-storybook:web

      - name: Run Storybook smoke tests
        if: steps.storybook_changes.outputs.run == 'true'
        run: npm run test:storybook:web

      - name: Capture Storybook screenshots
        if: steps.storybook_changes.outputs.run == 'true'
        run: npm run screenshots:storybook:web

      - name: Record skipped Storybook checks
        if: steps.storybook_changes.outputs.run != 'true'
        run: echo "Storybook checks skipped because this pull request does not change Storybook-relevant files." >> "$GITHUB_STEP_SUMMARY"

      - name: Add screenshot summary
        if: always() && steps.storybook_changes.outputs.run == 'true'
        run: |
          if [ -f artifacts/storybook-screenshots/summary.md ]; then
            cat artifacts/storybook-screenshots/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Storybook screenshot artifact
        if: always() && steps.storybook_changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-screenshots
          path: artifacts/storybook-screenshots
          if-no-files-found: ignore
          retention-days: 14
